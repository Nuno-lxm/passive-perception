# Every push and pull request: tests, a dry-run Cloudflare build and a Docker build.
# Pushes to main that pass all of that deploy to staging.
# Changes that only touch docs skip all of it. The jobs are skipped rather than not started, so a pull request's
# required checks still pass (a path filter under `on:` would leave them waiting forever).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Anything besides docs?
        id: diff
        run: |
          # Everything counts as code except these. When the diff can't be worked out (a new branch,
          # a force push), run everything.
          DOCS='\.md$|^LICENSE$|^\.github/ISSUE_TEMPLATE/|^\.github/dependabot\.yml$'
          if files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$files" ]; then
            if [ -n "$(grep -vE "$DOCS" <<< "$files")" ]; then code=true; else code=false; fi
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; echo "${files:-(unknown)}"; echo "Run the checks: $code"
          if [ "$code" = false ]; then echo "Only docs changed: tests, builds and the deploy were skipped." >> "$GITHUB_STEP_SUMMARY"; fi
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Cloudflare build (dry run)
        run: pnpm wrangler deploy --dry-run --outdir dist

  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the self-hosting image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy to staging
        id: deploy
        run: |
          pnpm wrangler deploy --env staging | tee deploy.log
          echo "version=$(grep -oP 'Current Version ID: \K\S+' deploy.log)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test staging
        id: smoke
        run: node test/smoke.js "${{ vars.STAGING_URL }}"
        if: vars.STAGING_URL != ''
      - name: Summary
        if: always()
        run: |
          {
            echo "### Staging deploy"
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ steps.deploy.outcome == 'success' && '✅ deployed' || '❌ failed' }} |"
            echo "| URL | ${{ vars.STAGING_URL || '(set the STAGING_URL variable)' }} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Worker version | \`${{ steps.deploy.outputs.version || 'n/a' }}\` |"
            echo "| Smoke test (secrets stay secret) | ${{ steps.smoke.outcome == 'success' && '✅ passed' || steps.smoke.outcome == 'skipped' && '⏭ skipped' || '❌ failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
