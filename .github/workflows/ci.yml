# Every push and pull request: tests, a dry-run Cloudflare build and a Docker build.
# Pushes to main that pass all of that deploy to staging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Cloudflare build (dry run)
        run: pnpm wrangler deploy --dry-run --outdir dist

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the self-hosting image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy to staging
        id: deploy
        run: |
          pnpm wrangler deploy --env staging | tee deploy.log
          echo "version=$(grep -oP 'Current Version ID: \K\S+' deploy.log)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test staging
        id: smoke
        run: node test/smoke.js "${{ vars.STAGING_URL }}"
        if: vars.STAGING_URL != ''
      - name: Summary
        if: always()
        run: |
          {
            echo "### Staging deploy"
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ steps.deploy.outcome == 'success' && '✅ deployed' || '❌ failed' }} |"
            echo "| URL | ${{ vars.STAGING_URL || '(set the STAGING_URL variable)' }} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Worker version | \`${{ steps.deploy.outputs.version || 'n/a' }}\` |"
            echo "| Smoke test (secrets stay secret) | ${{ steps.smoke.outcome == 'success' && '✅ passed' || steps.smoke.outcome == 'skipped' && '⏭ skipped' || '❌ failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
