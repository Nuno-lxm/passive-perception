# Publishing a GitHub release (e.g. v1.0.0) puts that version live and publishes the Docker image.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy the public site
        id: deploy
        run: |
          pnpm wrangler deploy --message "Release ${{ github.event.release.tag_name }}" | tee deploy.log
          echo "version=$(grep -oP 'Current Version ID: \K\S+' deploy.log)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test the public site
        id: smoke
        run: node test/smoke.js "${{ vars.PRODUCTION_URL }}"
        if: vars.PRODUCTION_URL != ''
      - name: Summary
        if: always()
        run: |
          {
            echo "### Live deploy: ${{ github.event.release.tag_name }}"
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ steps.deploy.outcome == 'success' && '✅ live' || '❌ failed' }} |"
            echo "| URL | ${{ vars.PRODUCTION_URL || '(set the PRODUCTION_URL variable)' }} |"
            echo "| Worker version | \`${{ steps.deploy.outputs.version || 'n/a' }}\` |"
            echo "| Smoke test (secrets stay secret) | ${{ steps.smoke.outcome == 'success' && '✅ passed' || steps.smoke.outcome == 'skipped' && '⏭ skipped' || '❌ failed' }} |"
            echo ""
            echo "Something wrong? Actions → **Rollback** → Run workflow → production."
          } >> "$GITHUB_STEP_SUMMARY"

  docker-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (Docker needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and publish (amd64 + arm64, e.g. Raspberry Pi)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Docker image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
